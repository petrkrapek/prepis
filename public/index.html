<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Přepis zvuku</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎙️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: light;
  --paper: #edf0f3;
  --surface: #ffffff;
  --ink: #16212c;
  --muted: #5b6875;
  --line: #d3d9df;
  --accent: #2f4bc4;
  --accent-ink: #ffffff;
  --rec: #c2363f;
  --ok: #1f7a4d;
  --ui: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --read: "Source Serif 4", Georgia, "Times New Roman", serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --paper: #12171d;
    --surface: #1a2129;
    --ink: #e6ebf0;
    --muted: #93a0ad;
    --line: #2c3640;
    --accent: #8ea2ff;
    --accent-ink: #0e1430;
    --rec: #ff6b73;
    --ok: #5fd39a;
  }
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font: 400 1rem/1.55 var(--ui);
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 72rem; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: 1.5rem; }
h1 { font-size: 1.6rem; line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
.lock { background: none; border: 0; color: var(--muted); cursor: pointer; padding: .25rem; text-decoration: underline; text-underline-offset: 3px; }

.grid { display: grid; gap: 1.5rem; grid-template-columns: minmax(0, 26rem) minmax(0, 1fr); align-items: start; }
@media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1.25rem; }
fieldset { border: 0; padding: 0; margin: 0 0 1.25rem; min-width: 0; }
legend, .label { font-weight: 700; margin-bottom: .45rem; padding: 0; display: block; }
.hint { color: var(--muted); font-size: .875rem; margin: .35rem 0 0; }

/* přepínače */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label { text-align: center; padding: .5rem .6rem; border-radius: 7px; cursor: pointer; color: var(--muted); }
.seg input:checked + label { background: var(--ink); color: var(--surface); }
.seg input:focus-visible + label { outline: 3px solid var(--accent); outline-offset: 1px; }

/* nahrávání */
.recorder { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 1rem; }
.rec-btn {
  width: 5.5rem; height: 5.5rem; border-radius: 50%;
  border: 2px solid var(--rec); background: transparent; cursor: pointer;
  display: grid; place-items: center; position: relative;
}
.rec-btn::after { content: ""; width: 2.2rem; height: 2.2rem; border-radius: 50%; background: var(--rec); transition: border-radius .2s, width .2s, height .2s; }
.rec-btn[aria-pressed="true"]::after { width: 1.7rem; height: 1.7rem; border-radius: 5px; }
.rec-btn canvas { position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px); pointer-events: none; }
.rec-time { font-size: 1.75rem; font-variant-numeric: tabular-nums; line-height: 1; }
.rec-state { color: var(--muted); font-size: .875rem; }
.file-drop { display: block; border: 1.5px dashed var(--line); border-radius: 10px; padding: 1.1rem; text-align: center; cursor: pointer; color: var(--muted); }
.file-drop:hover, .file-drop.over { border-color: var(--accent); color: var(--ink); }
.file-drop input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.picked { margin-top: .75rem; display: none; }
.picked.on { display: block; }
.picked audio { width: 100%; margin-top: .4rem; }
[hidden] { display: none !important; }

select, textarea, input[type="password"] {
  width: 100%; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: .55rem .65rem;
}
textarea { resize: vertical; min-height: 5.5rem; }
.check { display: flex; gap: .55rem; align-items: center; cursor: pointer; }
.check input { width: 1.1rem; height: 1.1rem; accent-color: var(--accent); }
.note-off { opacity: .55; }

.primary {
  width: 100%; border: 0; border-radius: 10px; padding: .8rem 1rem; cursor: pointer;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 1.05rem;
}
.primary:disabled { opacity: .45; cursor: not-allowed; }

/* výstup */
.out { position: sticky; top: calc(1rem + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; min-height: 24rem; }
.out-head { display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding-bottom: .9rem; border-bottom: 1px solid var(--line); }
.out-head h2 { font-size: 1.1rem; margin: 0; }
.copy { border: 1px solid var(--ink); background: var(--ink); color: var(--surface); border-radius: 8px; padding: .5rem .9rem; cursor: pointer; font-weight: 700; }
.copy:disabled { opacity: .35; cursor: not-allowed; }
.copy.done { background: var(--ok); border-color: var(--ok); }
.text {
  flex: 1; margin-top: 1rem; font-family: var(--read); font-size: 1.08rem; line-height: 1.7;
  white-space: pre-wrap; overflow-wrap: anywhere; max-width: 68ch; max-height: 70vh; overflow-y: auto;
}
.empty { color: var(--muted); font-family: var(--ui); font-size: 1rem; }
.status { display: flex; align-items: center; gap: .6rem; color: var(--muted); font-family: var(--ui); font-size: 1rem; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: .6rem; max-width: 22rem; }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.err { color: var(--rec); font-family: var(--ui); }
.meta { color: var(--muted); font-size: .85rem; margin-top: .75rem; }

dialog { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 1.5rem; width: min(24rem, calc(100vw - 2rem)); }
dialog::backdrop { background: rgb(0 0 0 / .45); }
dialog h2 { margin: 0 0 .75rem; font-size: 1.2rem; }
dialog form { display: grid; gap: .9rem; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Přepis zvuku</h1>
    <button class="lock" id="logout" type="button" hidden>Odhlásit</button>
  </header>

  <div class="grid">
    <section class="panel" aria-label="Zadání přepisu">
      <fieldset>
        <legend>Zvuk</legend>
        <div class="seg" role="radiogroup">
          <input type="radio" name="src" id="src-rec" value="rec" checked><label for="src-rec">Nahrát mikrofonem</label>
          <input type="radio" name="src" id="src-file" value="file"><label for="src-file">Vybrat soubor</label>
        </div>

        <div id="pane-rec" style="margin-top:1rem">
          <div class="recorder">
            <button class="rec-btn" id="rec" type="button" aria-pressed="false" aria-label="Spustit nahrávání">
              <canvas id="level" width="220" height="220" aria-hidden="true"></canvas>
            </button>
            <div>
              <div class="rec-time" id="rec-time">0:00</div>
              <div class="rec-state" id="rec-state">Klepněte pro spuštění nahrávání</div>
            </div>
          </div>
        </div>

        <div id="pane-file" style="margin-top:1rem" hidden>
          <label class="file-drop" id="drop">
            <input type="file" id="file" accept="audio/*,video/*">
            Přetáhněte sem zvukový nebo video soubor, nebo klepněte a vyberte ho
          </label>
        </div>

        <div class="picked" id="picked">
          <div id="picked-name"></div>
          <audio id="preview" controls preload="metadata"></audio>
        </div>
      </fieldset>

      <fieldset>
        <legend>Přepisová služba</legend>
        <div class="seg" role="radiogroup">
          <input type="radio" name="provider" id="p-soniox" value="soniox" checked><label for="p-soniox">Soniox</label>
          <input type="radio" name="provider" id="p-eleven" value="elevenlabs"><label for="p-eleven">ElevenLabs Scribe</label>
        </div>
      </fieldset>

      <fieldset>
        <label class="label" for="lang">Jazyk nahrávky</label>
        <select id="lang">
          <option value="cs" selected>Čeština</option>
          <option value="sk">Slovenština</option>
          <option value="en">Angličtina</option>
          <option value="de">Němčina</option>
          <option value="auto">Rozpoznat automaticky</option>
        </select>
      </fieldset>

      <fieldset id="ctx-wrap">
        <label class="label" for="context">Kontext</label>
        <textarea id="context" rows="4" placeholder="O čem nahrávka je, kdo mluví, odkud pochází…"></textarea>
        <p class="hint" id="ctx-hint">Pomůže službě správně pochopit téma a jména.</p>
      </fieldset>

      <fieldset>
        <label class="label" for="terms">Odborné výrazy a jména</label>
        <textarea id="terms" rows="3" placeholder="Každý výraz na nový řádek, např.&#10;NIS Chameleon&#10;chemostacionář"></textarea>
        <p class="hint">Nejvýš 100 výrazů, každý do 50 znaků.</p>
      </fieldset>

      <fieldset>
        <label class="check"><input type="checkbox" id="diarize"> Rozlišit mluvčí</label>
      </fieldset>

      <button class="primary" id="go" type="button" disabled>Přepsat</button>
    </section>

    <section class="panel out" aria-live="polite" aria-label="Výsledek přepisu">
      <div class="out-head">
        <h2>Přepis</h2>
        <button class="copy" id="copy" type="button" disabled>Kopírovat celý přepis</button>
      </div>
      <div class="text" id="out"><p class="empty">Přepis se zobrazí tady. Nahrajte zvuk nebo vyberte soubor a klepněte na Přepsat.</p></div>
      <div class="meta" id="meta"></div>
    </section>
  </div>
</div>

<dialog id="login">
  <form method="dialog" id="login-form">
    <h2>Přihlášení</h2>
    <div>
      <label class="label" for="pw">Heslo k aplikaci</label>
      <input type="password" id="pw" autocomplete="current-password" required>
      <p class="hint err" id="pw-err" hidden></p>
    </div>
    <button class="primary" type="submit">Pokračovat</button>
  </form>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const PW_KEY = "prepis-heslo";
  let password = "";
  try { password = localStorage.getItem(PW_KEY) || ""; } catch {}

  let audio = null;            // { blob, name }
  let recorder = null, stream = null, chunks = [], t0 = 0, timer = null, raf = null, actx = null;
  let busy = false, transcript = "";

  // ---------- přihlášení ----------
  function askPassword(message) {
    $("pw-err").hidden = !message;
    $("pw-err").textContent = message || "";
    $("pw").value = "";
    $("login").showModal();
  }
  $("login-form").addEventListener("submit", () => {
    password = $("pw").value;
    try { localStorage.setItem(PW_KEY, password); } catch {}
    $("logout").hidden = false;
  });
  $("logout").addEventListener("click", () => {
    password = "";
    try { localStorage.removeItem(PW_KEY); } catch {}
    $("logout").hidden = true;
    askPassword();
  });
  if (!password) askPassword(); else $("logout").hidden = false;

  async function api(path, opts = {}) {
    const res = await fetch(path, { ...opts, headers: { ...(opts.headers || {}), "x-app-password": password } });
    let data = {};
    try { data = await res.json(); } catch {}
    if (res.status === 401) {
      try { localStorage.removeItem(PW_KEY); } catch {}
      askPassword("Heslo nesouhlasí. Zadejte ho znovu.");
      throw new Error("Přihlaste se a klepněte na Přepsat znovu.");
    }
    if (!res.ok) throw new Error(data.error || `Server vrátil chybu ${res.status}.`);
    return data;
  }

  // ---------- volba zdroje ----------
  document.querySelectorAll('input[name="src"]').forEach((r) => r.addEventListener("change", () => {
    const file = $("src-file").checked;
    $("pane-file").hidden = !file;
    $("pane-rec").hidden = file;
  }));

  function setAudio(blob, name) {
    audio = { blob, name };
    const url = URL.createObjectURL(blob);
    $("preview").src = url;
    $("picked-name").textContent = `${name} · ${(blob.size / 1024 / 1024).toFixed(1)} MB`;
    $("picked").classList.add("on");
    updateGo();
  }

  // ---------- soubor ----------
  $("file").addEventListener("change", (e) => {
    const f = e.target.files[0];
    if (f) setAudio(f, f.name);
  });
  const drop = $("drop");
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => {
    const f = e.dataTransfer.files[0];
    if (f) setAudio(f, f.name);
  });

  // ---------- nahrávání ----------
  function pickMime() {
    const options = ["audio/webm;codecs=opus", "audio/mp4", "audio/ogg;codecs=opus", "audio/webm"];
    return options.find((m) => window.MediaRecorder && MediaRecorder.isTypeSupported(m)) || "";
  }
  const fmt = (s) => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  $("rec").addEventListener("click", async () => {
    if (recorder && recorder.state === "recording") { recorder.stop(); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    } catch {
      $("rec-state").textContent = "Mikrofon není dostupný. Povolte ho v prohlížeči.";
      return;
    }
    const mime = pickMime();
    recorder = new MediaRecorder(stream, { ...(mime && { mimeType: mime }), audioBitsPerSecond: 32000 });
    chunks = [];
    recorder.ondataavailable = (e) => e.data.size && chunks.push(e.data);
    recorder.onstop = () => {
      clearInterval(timer); cancelAnimationFrame(raf);
      stream.getTracks().forEach((t) => t.stop());
      if (actx) actx.close();
      clearLevel();
      $("rec").setAttribute("aria-pressed", "false");
      $("rec").setAttribute("aria-label", "Spustit nahrávání");
      const type = recorder.mimeType || "audio/webm";
      const ext = type.includes("mp4") ? "m4a" : type.includes("ogg") ? "ogg" : "webm";
      const secs = (Date.now() - t0) / 1000;
      $("rec-state").textContent = `Nahráno ${fmt(secs)}. Klepněte pro novou nahrávku.`;
      setAudio(new Blob(chunks, { type }), `nahravka.${ext}`);
    };
    recorder.start(1000);
    t0 = Date.now();
    $("rec-time").textContent = "0:00";
    $("rec").setAttribute("aria-pressed", "true");
    $("rec").setAttribute("aria-label", "Zastavit nahrávání");
    $("rec-state").textContent = "Nahrává se. Klepněte pro zastavení.";
    timer = setInterval(() => { $("rec-time").textContent = fmt((Date.now() - t0) / 1000); }, 250);
    drawLevel(stream);
  });

  // kruhový ukazatel hlasitosti kolem tlačítka
  function drawLevel(s) {
    actx = new AudioContext();
    const an = actx.createAnalyser();
    an.fftSize = 512;
    actx.createMediaStreamSource(s).connect(an);
    const buf = new Uint8Array(an.fftSize);
    const c = $("level"), g = c.getContext("2d");
    const red = getComputedStyle(document.documentElement).getPropertyValue("--rec").trim();
    let smooth = 0;
    const tick = () => {
      an.getByteTimeDomainData(buf);
      let sum = 0;
      for (const v of buf) sum += ((v - 128) / 128) ** 2;
      smooth = Math.max(Math.sqrt(sum / buf.length) * 3, smooth * 0.9);
      const lvl = Math.min(1, smooth);
      g.clearRect(0, 0, c.width, c.height);
      g.strokeStyle = red;
      g.lineWidth = 6;
      g.globalAlpha = 0.25 + lvl * 0.75;
      g.beginPath();
      g.arc(c.width / 2, c.height / 2, 66 + lvl * 34, 0, Math.PI * 2);
      g.stroke();
      raf = requestAnimationFrame(tick);
    };
    tick();
  }
  function clearLevel() { const c = $("level"); c.getContext("2d").clearRect(0, 0, c.width, c.height); }

  // ---------- volby ----------
  function provider() { return document.querySelector('input[name="provider"]:checked').value; }
  function syncProvider() {
    const eleven = provider() === "elevenlabs";
    $("context").disabled = eleven;
    $("ctx-wrap").classList.toggle("note-off", eleven);
    $("ctx-hint").textContent = eleven
      ? "ElevenLabs volný kontext nepoužívá. Použije jen odborné výrazy níže."
      : "Pomůže službě správně pochopit téma a jména.";
  }
  document.querySelectorAll('input[name="provider"]').forEach((r) => r.addEventListener("change", syncProvider));
  syncProvider();

  function updateGo() { $("go").disabled = busy || !audio; }

  // ---------- přepis ----------
  function showStatus(msg, pct) {
    $("out").innerHTML = "";
    const p = document.createElement("div");
    p.className = "status";
    p.textContent = msg;
    $("out").append(p);
    if (pct != null) {
      const bar = document.createElement("div");
      bar.className = "bar";
      bar.innerHTML = `<span style="width:${pct}%"></span>`;
      $("out").append(bar);
    }
  }
  function showError(msg) {
    $("out").innerHTML = "";
    const p = document.createElement("p");
    p.className = "err";
    p.textContent = msg;
    $("out").append(p);
  }
  function showText(text) {
    transcript = text;
    $("out").textContent = text || "Služba v nahrávce nenašla žádnou řeč.";
    $("copy").disabled = !text;
    const words = text ? text.trim().split(/\s+/).length : 0;
    $("meta").textContent = text ? `${words} slov, ${text.length} znaků` : "";
  }

  $("go").addEventListener("click", async () => {
    if (!password) { askPassword(); return; }
    busy = true; updateGo();
    transcript = ""; $("copy").disabled = true; $("meta").textContent = "";
    const started = Date.now();
    try {
      const terms = $("terms").value.split(/\r?\n|,/).map((t) => t.trim()).filter(Boolean);
      const job = await api("/api/jobs", {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({
          provider: provider(),
          language: $("lang").value,
          context: provider() === "soniox" ? $("context").value : "",
          terms,
          diarize: $("diarize").checked,
          mime: audio.blob.type || "application/octet-stream",
          filename: audio.name,
          size: audio.blob.size,
        }),
      });

      for (let i = 0; i < job.chunks; i++) {
        showStatus(`Nahrávám zvuk na server… ${i + 1} z ${job.chunks}`, (i / job.chunks) * 100);
        const part = audio.blob.slice(i * job.chunkBytes, (i + 1) * job.chunkBytes);
        await api(`/api/upload?job=${job.id}&index=${i}`, {
          method: "POST",
          headers: { "content-type": "application/octet-stream" },
          body: part,
        });
      }

      showStatus("Předávám zvuk přepisové službě…");
      await api(`/api/start?job=${job.id}`, { method: "POST" });

      while (true) {
        const secs = Math.round((Date.now() - started) / 1000);
        showStatus(`Přepisuje se… ${fmt(secs)}`);
        await new Promise((r) => setTimeout(r, 3000));
        const st = await api(`/api/status?job=${job.id}`);
        if (st.status === "completed") { showText(st.text); break; }
        if (st.status === "error") throw new Error(st.error || "Přepis se nezdařil.");
      }
    } catch (e) {
      showError(e.message);
    } finally {
      busy = false; updateGo();
    }
  });

  // ---------- kopírování ----------
  $("copy").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(transcript);
    } catch {
      const r = document.createRange();
      r.selectNodeContents($("out"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
      document.execCommand("copy");
      s.removeAllRanges();
    }
    const b = $("copy");
    b.textContent = "Zkopírováno";
    b.classList.add("done");
    setTimeout(() => { b.textContent = "Kopírovat celý přepis"; b.classList.remove("done"); }, 1800);
  });
})();
</script>
</body>
</html>
